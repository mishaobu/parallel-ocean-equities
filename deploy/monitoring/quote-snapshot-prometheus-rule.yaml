apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: parallel-ocean-equities-quote-snapshots
  namespace: equities
  labels:
    app: parallel-ocean-equities
    app.kubernetes.io/name: parallel-ocean-equities
    release: kube-prometheus-stack
spec:
  groups:
    - name: parallel-ocean-equities.quote-snapshots
      interval: 30s
      rules:
        - alert: EquitiesQuoteSnapshotSchedulerDown
          expr: |
            max by (namespace) (
              equities_scheduled_snapshot_scheduler_running{namespace="equities"}
            ) == 0
            or
            absent(equities_scheduled_snapshot_scheduler_running{namespace="equities"})
          for: 10m
          labels:
            severity: critical
            service: parallel-ocean-equities
          annotations:
            summary: Equities quote snapshot scheduler is not running
            description: The traffic-independent quote sampler has been stopped or absent for 10 minutes.

        - alert: EquitiesMacroRefreshDegraded
          expr: |
            (
              max by (namespace) (
                equities_macro_degraded{namespace="equities"}
              ) == 1
            )
            and on (namespace)
            (
              max by (namespace) (
                equities_macro_last_success_timestamp_seconds{namespace="equities"}
              ) > 0
            )
            and on (namespace)
            (
              max by (namespace) (
                equities_macro_stale{namespace="equities"}
              ) == 0
            )
          for: 15m
          labels:
            severity: warning
            service: parallel-ocean-equities
          annotations:
            summary: Macro refresh is degraded but a usable baseline remains
            description: The most recent macro refresh failed for 15 minutes; a prior successful baseline is still within the backend freshness limit.

        - alert: EquitiesMacroBaselineUnavailableOrStale
          expr: |
            (
              max by (namespace) (
                equities_macro_last_success_timestamp_seconds{namespace="equities"}
              ) == 0
            )
            or
            (
              max by (namespace) (
                equities_macro_stale{namespace="equities"}
              ) == 1
            )
          for: 30m
          labels:
            severity: critical
            service: parallel-ocean-equities
          annotations:
            summary: Macro baseline is unavailable or stale
            description: No successful macro baseline exists, or the last successful baseline has exceeded the backend freshness limit for 30 minutes.

        - alert: EquitiesRegularSessionQuoteStale
          expr: |
            max by (namespace, ticker) (
              equities_scheduled_snapshot_stale{
                namespace="equities",
                market_state="regular"
              }
            ) == 1
          for: 15m
          labels:
            severity: warning
            service: parallel-ocean-equities
          annotations:
            summary: Regular-session quote is stale for {{ $labels.ticker }}
            description: The latest provider observation remained stale while the provider reported regular trading.

        - alert: EquitiesOffSessionQuotePollingStale
          expr: |
            (
              max by (namespace, ticker) (
                equities_scheduled_snapshot_stale{
                  namespace="equities",
                  market_state=~"pre|post|closed|unknown"
                }
              ) == 1
            )
            and on (namespace, ticker)
            (
              max by (namespace, ticker) (
                equities_scheduled_snapshot_last_observation_timestamp_seconds{
                  namespace="equities"
                }
              ) > 0
            )
          for: 30m
          labels:
            severity: warning
            service: parallel-ocean-equities
          annotations:
            summary: Off-session quote polling is stale for {{ $labels.ticker }}
            description: No healthy non-regular or unknown-state poll completed within the backend's 150-minute health window.

        - alert: EquitiesQuoteProviderThrottled
          expr: |
            (
              sum by (namespace) (
                increase(equities_scheduled_snapshot_failures_total{
                  namespace="equities",
                  reason="throttled"
                }[30m])
              )
              +
              sum by (namespace) (
                increase(equities_scheduled_snapshot_history_refresh_failures_total{
                  namespace="equities",
                  reason="throttled"
                }[30m])
              )
              +
              sum by (namespace) (
                increase(equities_scheduled_snapshot_benchmark_history_refresh_failures_total{
                  namespace="equities",
                  reason="throttled"
                }[30m])
              )
            ) > 0
          for: 5m
          labels:
            severity: warning
            service: parallel-ocean-equities
          annotations:
            summary: Equities quote provider is throttling requests
            description: At least one current-quote or history refresh request was throttled in the last 30 minutes.

        - alert: EquitiesQuoteHistoryRefreshDegraded
          expr: |
            (
              sum by (namespace) (
                increase(equities_scheduled_snapshot_history_refresh_failures_total{
                  namespace="equities"
                }[1h])
              )
              +
              sum by (namespace) (
                increase(equities_scheduled_snapshot_benchmark_history_refresh_failures_total{
                  namespace="equities"
                }[1h])
              )
            ) >= 3
          for: 10m
          labels:
            severity: warning
            service: parallel-ocean-equities
          annotations:
            summary: Equities quote-history refreshes are repeatedly failing
            description: Three or more long-history refresh attempts failed in the last hour; current quotes may be using a stale cache.

        - alert: EquitiesQuoteHistoryCacheStale
          expr: |
            (
              max by (namespace, ticker) (
                equities_scheduled_snapshot_history_cache_status{
                  namespace="equities",
                  status="stale"
                }
              ) == 1
            )
            and on (namespace, ticker)
            (
              max by (namespace, ticker) (
                equities_scheduled_snapshot_history_cache_age_seconds{
                  namespace="equities"
                }
              ) > 129600
            )
          for: 1h
          labels:
            severity: warning
            service: parallel-ocean-equities
          annotations:
            summary: Quote-history cache is stale for {{ $labels.ticker }}
            description: The scheduler has used a target history cache older than 36 hours for one hour.

        - alert: EquitiesQuoteHistoryCacheUnavailable
          expr: |
            (
              max by (namespace, ticker) (
                equities_scheduled_snapshot_history_cache_status{
                  namespace="equities",
                  status="unavailable"
                }
              ) == 1
            )
            and on (namespace, ticker)
            (
              max by (namespace, ticker) (
                equities_scheduled_snapshot_last_healthy_check_timestamp_seconds{
                  namespace="equities"
                }
              ) > 0
            )
          for: 1h
          labels:
            severity: warning
            service: parallel-ocean-equities
          annotations:
            summary: Quote-history cache is unavailable for {{ $labels.ticker }}
            description: Current polling is healthy, but the target ten-year history cache has remained unavailable for one hour.

        - alert: EquitiesBenchmarkHistoryCacheDegraded
          expr: |
            (
              (
                max by (namespace, benchmark) (
                  equities_scheduled_snapshot_benchmark_history_cache_status{
                    namespace="equities",
                    benchmark="SPY",
                    status="stale"
                  }
                ) == 1
              )
              and on (namespace, benchmark)
              (
                max by (namespace, benchmark) (
                  equities_scheduled_snapshot_benchmark_history_cache_age_seconds{
                    namespace="equities",
                    benchmark="SPY"
                  }
                ) > 129600
              )
            )
            or
            (
              max by (namespace, benchmark) (
                equities_scheduled_snapshot_benchmark_history_cache_status{
                  namespace="equities",
                  benchmark="SPY",
                  status="unavailable"
                }
              ) == 1
            )
          for: 1h
          labels:
            severity: warning
            service: parallel-ocean-equities
          annotations:
            summary: Shared {{ $labels.benchmark }} benchmark history cache is degraded
            description: The shared beta-benchmark cache has remained unavailable, or stale and older than 36 hours, for one hour. This single alert represents all dependent tickers.

        - alert: EquitiesQuoteFieldCoverageLow
          expr: |
            (
              min by (namespace, ticker) (
                equities_scheduled_snapshot_quote_field_coverage_ratio{
                  namespace="equities"
                }
              ) < 0.75
            )
            and on (namespace, ticker)
            (
              max by (namespace, ticker) (
                equities_scheduled_snapshot_last_healthy_check_timestamp_seconds{
                  namespace="equities"
                }
              ) > 0
            )
            and on (namespace, ticker)
            (
              time()
              - max by (namespace, ticker) (
                  equities_scheduled_snapshot_last_healthy_check_timestamp_seconds{
                    namespace="equities"
                  }
                ) < 10800
            )
          for: 30m
          labels:
            severity: warning
            service: parallel-ocean-equities
          annotations:
            summary: Quote field coverage is low for {{ $labels.ticker }}
            description: A recently healthy poll supplied less than 75 percent of the expected core quote fields for 30 minutes.

        - alert: EquitiesQuoteObservationMissingOrVeryOld
          expr: |
            (
              max by (namespace, ticker) (
                equities_scheduled_snapshot_last_observation_timestamp_seconds{
                  namespace="equities"
                }
              ) == 0
            )
            or
            (
              (
                time()
                - max by (namespace, ticker) (
                    equities_scheduled_snapshot_last_observation_timestamp_seconds{
                      namespace="equities"
                    }
                  ) > 604800
              )
              and on (namespace, ticker)
              (
                max by (namespace, ticker) (
                  equities_scheduled_snapshot_last_healthy_check_timestamp_seconds{
                    namespace="equities"
                  }
                ) == 0
                or
                time()
                - max by (namespace, ticker) (
                    equities_scheduled_snapshot_last_healthy_check_timestamp_seconds{
                      namespace="equities"
                    }
                  ) > 10800
              )
            )
          for: 30m
          labels:
            severity: critical
            service: parallel-ocean-equities
          annotations:
            summary: Quote observation is missing or over seven days old for {{ $labels.ticker }}
            description: The ticker has never produced a provider observation, or its latest observation is over seven days old while polling has also been unhealthy for three hours. The hold gives newly added tickers time for their first scheduled capture and avoids false pages during healthy exchange closures.
