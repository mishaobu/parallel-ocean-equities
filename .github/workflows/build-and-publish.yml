name: Build, publish, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: equities-${{ github.ref }}
  # Pull-request feedback may be superseded, but a main deployment must never
  # be cancelled after it has started mutating the production Deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: stagingeastusacr77.azurecr.io
  IMAGE: parallel-ocean-equities

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            monetary/package-lock.json
            macro/package-lock.json
      - run: go test ./...
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm ci
        working-directory: monetary
      - run: npm run typecheck
        working-directory: monetary
      - run: npm test -- --run
        working-directory: monetary
      - run: npm ci
        working-directory: macro
      - run: npm run typecheck
        working-directory: macro
      - run: npm test -- --run
        working-directory: macro

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: meta
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to Azure
        if: github.event_name == 'push'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR
        if: github.event_name == 'push'
        run: az acr login --name stagingeastusacr77
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:main-latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll, refresh, and verify AKS deployment
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          deployment_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          deployment_started_epoch="$(date -u +%s)"
          result="$(az aks command invoke \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group staging-rg \
            --name staging-aks-cluster \
            --output json \
            --command "set -eu
              previous_image=\$(kubectl -n equities get deploy/parallel-ocean-equities -o jsonpath='{.spec.template.spec.containers[?(@.name==\"equities\")].image}')
              rollback() {
                status=\$1
                trap - EXIT INT TERM
                if [ \"\$status\" -eq 0 ]; then status=1; fi
                echo \"deployment verification failed; rolling back to \$previous_image\" >&2
                rollback_started_at=\$(date -u +%Y-%m-%dT%H:%M:%SZ)
                rollback_started_epoch=\$(date -u +%s)
                kubectl -n equities set image deploy/parallel-ocean-equities equities=\"\$previous_image\"
                kubectl -n equities rollout restart deploy/parallel-ocean-equities
                kubectl -n equities rollout status deploy/parallel-ocean-equities --timeout=12m
                kubectl -n equities exec deploy/parallel-ocean-equities -c equities -- env STARTUP_REFRESH_NOT_BEFORE=\"\$rollback_started_at\" STARTUP_REFRESH_NOT_BEFORE_EPOCH=\"\$rollback_started_epoch\" STARTUP_REFRESH_ALLOW_MACRO_DEGRADED=true /app/verify-startup-refresh
                echo \"rollback verified: \$previous_image\" >&2
                exit \"\$status\"
              }
              trap 'rollback \$?' EXIT
              trap 'exit 130' INT TERM
              kubectl -n equities set env deploy/parallel-ocean-equities STARTUP_REFRESH=true
              kubectl -n equities set image deploy/parallel-ocean-equities equities=${REGISTRY}/${IMAGE}:${TAG}
              kubectl -n equities rollout status deploy/parallel-ocean-equities --timeout=12m
              kubectl -n equities exec deploy/parallel-ocean-equities -c equities -- env STARTUP_REFRESH_NOT_BEFORE=${deployment_started_at} STARTUP_REFRESH_NOT_BEFORE_EPOCH=${deployment_started_epoch} STARTUP_REFRESH_ALLOW_MACRO_DEGRADED=true /app/verify-startup-refresh
              trap - EXIT INT TERM")"
          printf '%s\n' "$result" | jq -r '.logs'
          test "$(printf '%s\n' "$result" | jq -r '.exitCode')" = "0"
